<html>
    <head>
        <title>
            JavaScript Text Change
        </title>
        <script>
            function ChangeText()
            {
                document.getElementById("demo").innerHTML = "Welcome to JavaScript:";
            }
        </script>
    </head>
    <body>
        <h2 id = "demo" >hello students</h2>
        <button onclick="ChangeText()">click me</button>
    </body>
</html>
