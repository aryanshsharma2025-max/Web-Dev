<!DOCTYPE html>
<html>
<head>
    <title>Add</title>
</head>
<body>
    <h2>Add 2 Numbers</h2>
    <script>
        function add() {
            let a = prompt("Enter 1st number");
            let b = prompt("Enter 2nd number");
            
            let num1 = Number(a);
            let num2 = Number(b);

            let sum = num1 + num2;

            alert("The sum is: " + sum);
        }
    </script>
    <button onclick="add()">Click me</button>
</body>
</html>
