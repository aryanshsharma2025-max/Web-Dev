<!DOCTYPE html>
<html>

<head>
    <title>Flat New Login Form</title>
    <style>
        body {
            background-color: #6bbbb6;
            font-family: Arial, sans-serif;
        }

        .input-box {
            width: 90%;
            padding: 10px;
            border: 1px solid #7eccca;
            border-radius: 4px;
            outline: none;
            font-size: 13px;
        }

        .btn-login {
            background-color: #23b7a4;
            color: white;
            border: none;
            padding: 10px 30px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-register {
            background-color: #23b7a4;
            color: white;
            border: none;
            padding: 8px 25px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .social-btn {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            display: block;
        }
    </style>
</head>

<body>

    <br><br>
    <center>
        <font color="white" size="6"><b>Flat New Login Form</b></font>
    </center>
    <br>

    <form>
        <table class="card" align="center">
            <tr>
                <td bgcolor="white">
                    <table width="100%">
                        <tr>
                            <td colspan="2" align="center">
                                <h2>Login</h2>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center">
                                <input type="text" placeholder="👤  User name" class="input-box">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center">
                                <input type="password" placeholder="🔑  ••••••••" class="input-box">
                            </td>
                        </tr>
                        <tr>
                            <td align="left" width="50%">
                                <input type="checkbox" checked>
                                <font size="2">Remember Me</font>
                            </td>
                            <td align="right" width="50%">
                                <font size="2">Forgot Password?</font>
                                </a>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center" style="padding-top: 15px;">
                                <input type="submit" value="Log In" class="btn-login">
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr bgcolor="#f8f9fa">
                <td style="padding: 20px 25px 25px 25px; border-top: 1px solid #edf1f1;">
                    <table width="100%" cellpadding="4" cellspacing="0">
                        <tr>
                            <td colspan="3" align="center">
                                <b>Login</b>
                                <br>
                                <font color="#777" size="2">With your social media account</font>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="3" height="8"></td>
                        </tr>
                        <tr>
                            <td width="33%" align="center">
                                <table width="95%" bgcolor="#00aced" cellpadding="8" cellspacing="0"
                                    style="border-radius: 3px;">
                                    <tr>
                                        <td align="center">
                                            <a href="#" class="social-btn">Twitter</a>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                            <td width="33%" align="center">
                                <table width="95%" bgcolor="#3b5998" cellpadding="8" cellspacing="0"
                                    style="border-radius: 3px;">
                                    <tr>
                                        <td align="center">
                                            <a href="#" class="social-btn">Facebook</a>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                            <td width="33%" align="center">
                                <table width="95%" bgcolor="#dd4b39" cellpadding="8" cellspacing="0"
                                    style="border-radius: 3px;">
                                    <tr>
                                        <td align="center">
                                            <a href="#" class="social-btn">Google+</a>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="3">
                                <hr color="#e2e6e6" size="1">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="3" align="center">
                                <font size="2" color="#555">
                                    Don,t have an Account?
                                    <a href="#" style="text-decoration: none;">
                                        <font color="#e56060">Register Now!</font>
                                    </a>
                                </font>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="3" align="center">
                                <input type="button" value="REGISTER" class="btn-register">
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </form>

    <br>
    <center>
        <font color="white" size="2">Design by W3layouts</font>
    </center>
    <br>

</body>

</html>
