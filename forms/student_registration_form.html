<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>

    <style>
        body {
            background-color: cyan;
        }

        h1 {
            text-align: center;
        }

        table {
            margin: auto;
        }
    </style>
</head>

<body>

    <h1><u>Student Registration Form</u></h1>

    <form>

        <table>

            <tr>
                <td>Roll no. :</td>
                <td><input type="text" id="rollno" size="50"></td>
            </tr>

            <tr>
                <td>Student name :</td>
                <td>
                    <input type="text" id="firstname" placeholder="First Name" required minlength="5">
                    <input type="text" id="lastname" placeholder="Last Name">
                </td>
            </tr>

            <tr>
                <td>Father's name :</td>
                <td><input type="text" id="fathername" size="50"></td>
            </tr>

            <tr>
                <td>Date of birth :</td>
                <td>
                    <input type="text" id="dob-day" placeholder="Day" size="5">
                    -
                    <input type="text" id="dob-month" placeholder="Month" size="5">
                    -
                    <input type="text" id="dob-year" placeholder="Year" size="8">
                    (DD-MM-YYYY)
                </td>
            </tr>

            <tr>
                <td>Mobile no. :</td>
                <td>
                    <input type="text" id="countrycode" value="+91" size="3">
                    -
                    <input type="text" id="mobileno" size="40" max="10">
                </td>
            </tr>

            <tr>
                <td>Email id :</td>
                <td><input type="email" id="email" size="50"></td>
            </tr>

            <tr>
                <td>Password :</td>
                <td><input type="password" id="password" size="50"></td>
            </tr>

            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" id="male" name="gender"> Male
                    <input type="radio" id="female" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Department :</td>
                <td>
                    <input type="checkbox" id="cse"> CSE
                    <input type="checkbox" id="it"> IT
                    <input type="checkbox" id="ece"> ECE
                    <input type="checkbox" id="civil"> Civil
                    <input type="checkbox" id="mech"> Mech
                </td>
            </tr>

            <tr>
                <td>Course :</td>
                <td>
                    <select id="course">
                        <option>Select Current Course</option>
                        <option>B.Tech</option>
                        <option>M.Tech</option>
                        <option>BCA</option>
                        <option>MCA</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Student photo :</td>
                <td><input type="file" id="photo"></td>
            </tr>

            <tr>
                <td>City :</td>
                <td><input type="text" id="city" size="50"></td>
            </tr>

            <tr>
                <td>Address :</td>
                <td>
                    <textarea id="address" rows="5" cols="50"></textarea>
                </td>
            </tr>
           

            <tr>
                <td></td>
                <td>
                    <input type="submit" id="register" value="Register">
                </td>

            </tr>

        </table>

    </form>

</body>

</html>
