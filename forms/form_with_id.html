<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Option</title>
  </head>

  <body>
    <form>
      <label for="name">Full Name:</label>
      <input
        type="text"
        name="name"
        id="name"
        placeholder="Enter your full name"
        required
        minlength="3"
      />
      <br />
      <br />
      <label for="email">Email: </label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      />
    </form>
  </body>
</html>
