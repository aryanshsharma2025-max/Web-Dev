<!DOCTYPE html>
<html>
<head>
  <title>Employee Salary Slip</title>
</head>
<body>
  <h2>Employee Salary Slip</h2>

  <label for="employeeName">Employee name:</label>
  <input type="text" id="employeeName" placeholder="Enter name"><br><br>

  <label for="basicSalary">Basic salary:</label>
  <input type="number" id="basicSalary" placeholder="Enter basic salary"><br><br>

  <button onclick="calculateSalary()">Generate Salary Slip</button>

  <p id="result"></p>

  <script>
    function calculateSalary() {
      let name = document.getElementById("employeeName").value;
      let basic = Number(document.getElementById("basicSalary").value);
      let da = basic * 0.20;
      let hra = basic * 0.10;
      let pf = basic * 0.12;
      let grossSalary = basic + da + hra;
      let netSalary = grossSalary - pf;

      document.getElementById("result").innerHTML =
        "Employee Name: " + name + "<br>" +
        "Basic Salary: Rs. " + basic + "<br>" +
        "DA: Rs. " + da + "<br>" +
        "HRA: Rs. " + hra + "<br>" +
        "PF: Rs. " + pf + "<br>" +
        "Net Salary: Rs. " + netSalary;
    }
  </script>
</body>
</html>
