<!DOCTYPE html>
<html>
<head>
  <title>Registration Form Validation</title>
</head>
<body>
  <h2>Student Registration Form</h2>

  <label for="studentName">Name:</label>
  <input type="text" id="studentName" placeholder="Enter your name"><br><br>

  <label for="email">Email:</label>
  <input type="text" id="email" placeholder="Enter your email"><br><br>

  <label for="password">Password:</label>
  <input type="password" id="password" placeholder="Enter password"><br><br>

  <button onclick="validateForm()">Register</button>

  <p id="result"></p>

  <script>
    function validateForm() {
      let name = document.getElementById("studentName").value;
      let email = document.getElementById("email").value;
      let password = document.getElementById("password").value;

      if (name.trim() === "") {
        document.getElementById("result").innerText = "Name cannot be empty.";
      } else if (!email.includes("@") || !email.includes(".")) {
        document.getElementById("result").innerText = "Enter a valid email address.";
      } else if (password.length < 6) {
        document.getElementById("result").innerText = "Password must have at least 6 characters.";
      } else {
        document.getElementById("result").innerText = "Registration successful!";
      }
    }
  </script>
</body>
</html>
