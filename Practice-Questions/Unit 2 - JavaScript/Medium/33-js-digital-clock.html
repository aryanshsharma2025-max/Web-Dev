<!doctype html>
<html>
  <head>
    <title>Digital Clock</title>
  </head>
  <body>
    <h2>Digital Clock</h2>

    <h3 id="clock"></h3>

    <script>
      function showTime() {
        let now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();

        if (hours < 10) {
          hours = "0" + hours;
        }

        if (minutes < 10) {
          minutes = "0" + minutes;
        }

        if (seconds < 10) {
          seconds = "0" + seconds;
        }

        document.getElementById("clock").innerText =
          hours + ":" + minutes + ":" + seconds;
      }

      showTime();
      setInterval(showTime, 1000);
    </script>
  </body>
</html>
