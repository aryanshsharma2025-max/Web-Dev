<!DOCTYPE html>
<html>
<head>
  <title>Password Validation</title>
</head>
<body>
  <h2>Validate Password</h2>

  <label for="password">Enter Password:</label>
  <input type="password" id="password" placeholder="Enter password">
  <button onclick="validatePassword()">Validate</button>

  <p id="message"></p>

  <script>
    function validatePassword() {
      let password = document.getElementById("password").value;

      if (password.length < 8) {
        document.getElementById("message").innerText = "Error: Password must be at least 8 characters long.";
      } else {
        document.getElementById("message").style.color = "green";
        document.getElementById("message").innerText = "Password is valid.";
      }
    }
  </script>
</body>
</html>
