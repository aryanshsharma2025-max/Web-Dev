<!DOCTYPE html>
<html>
<head>
  <title>Pass or Fail</title>
</head>
<body>
  <h2>Check Pass or Fail</h2>

  <label for="marks">   Enter marks:</label>
  <input type="number" id="marks" placeholder="Enter your marks (Upto 40)">
  <button onclick="checkResult()">Check</button>

  <p id="result"></p>

  <script>
    function checkResult() {
      let marks = document.getElementById("marks").value;

      marks = Number(marks);

      if (marks >= 16) {
        document.getElementById("result").innerText = "The student is PASS.";
      } else {
        document.getElementById("result").innerText = "The student is FAIL";
      }
    }
  </script>
</body>
</html>
