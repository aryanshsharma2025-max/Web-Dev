<!DOCTYPE html>
<html>
<head>
  <title>Largest of Three Numbers</title>
</head>
<body>
  <h2>Find Largest of Three Numbers</h2>

  <label for="num1">Enter first number:</label>
  <input type="number" id="num1" placeholder="First number"><br><br>

  <label for="num2">Enter second number:</label>
  <input type="number" id="num2" placeholder="Second number"><br><br>

  <label for="num3">Enter third number:</label>
  <input type="number" id="num3" placeholder="Third number"><br><br>

  <button onclick="findLargest()">Find Largest</button>

  <p id="result"></p>

  <script>
    function findLargest() {
      let a = document.getElementById("num1").value;
      let b = document.getElementById("num2").value;
      let c = document.getElementById("num3").value;

      a = Number(a);
      b = Number(b);
      c = Number(c);

      let largest;

      if (a >= b && a >= c) {
        largest = a;
      } else if (b >= a && b >= c) {
        largest = b;
      } else {
        largest = c;
      }

      document.getElementById("result").innerText = "Largest number is: " + largest;
    }
  </script>
</body>
</html>
