<!DOCTYPE html>
<html>
<head>
  <title>Simple Interest</title>
</head>
<body>
  <h2>Calculate Simple Interest</h2>

  <label for="principal">Enter principal amount:</label>
  <input type="number" id="principal" placeholder="Principal"><br><br>

  <label for="rate">Enter rate of interest:</label>
  <input type="number" id="rate" placeholder="Rate (%)"><br><br>

  <label for="time">Enter time (years):</label>
  <input type="number" id="time" placeholder="Time"><br><br>

  <button onclick="calculateSI()">Calculate</button>

  <p id="result"></p>

  <script>
    function calculateSI() {
      let p = document.getElementById("principal").value;
      let r = document.getElementById("rate").value;
      let t = document.getElementById("time").value;

      p = Number(p);
      r = Number(r);
      t = Number(t);

      let si = (p * r * t) / 100;

      document.getElementById("result").innerText = "Simple Interest is: " + si;
    }
  </script>
</body>
</html>
