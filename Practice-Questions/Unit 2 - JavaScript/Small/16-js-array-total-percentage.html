<!DOCTYPE html>
<html>
<head>
  <title>Total and Percentage</title>
</head>
<body>
  <h2>Calculate Total and Percentage</h2>

  <label for="marks">Enter marks of 5 subjects (comma separated):</label><br>
  <input type="text" id="marks" placeholder="e.g. 85,90,78,92,88" style="width: 250px;">
  <button onclick="calculate()">Calculate</button>

  <p id="result"></p>

  <script>
    function calculate() {
      let marksStr = document.getElementById("marks").value;
      let marks = marksStr.split(",");

      let total = 0;

      for (let i = 0; i < marks.length; i++) {
        total = total + Number(marks[i]);
      }

      let percentage = total / marks.length;

      document.getElementById("result").innerHTML =
        "Total: " + total + "<br>" +
        "Percentage: " + percentage + "%";
    }
  </script>
</body>
</html>
