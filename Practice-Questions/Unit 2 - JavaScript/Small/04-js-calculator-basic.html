<!DOCTYPE html>
<html>
<head>
  <title>Perform Basic Operations</title>
</head>
<body>
  <h2>Perform Basic Operations</h2>

  <!-- Input area -->
  <label for="num1">Enter first number:</label>
  <input type="number" id="num1" placeholder="First number"><br><br>

  <label for="num2">Enter second number:</label>
  <input type="number" id="num2" placeholder="Second number"><br><br>

  <button onclick="calculate()">Calculate</button>

  <p id="result"></p>

  <script>
    function calculate() {
      let a = Number(document.getElementById("num1").value);
      let b = Number(document.getElementById("num2").value);

      let sum = a + b;
      let difference = a - b;
      let product = a * b;
      let quotient = b !== 0 ? (a / b) : "Undefined (division by zero)";
      document.getElementById("result").innerHTML =
        "Sum: " + sum + "<br>" +
        "Difference: " + difference + "<br>" +
        "Product: " + product + "<br>" +
        "Quotient: " + quotient;
    }
  </script>
</body>
</html>
