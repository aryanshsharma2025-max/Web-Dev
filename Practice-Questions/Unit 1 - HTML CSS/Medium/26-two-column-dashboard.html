<!doctype html>
<html>
  <head>
    <title>Two Column Dashboard</title>
    <style>
      body {
        font-family: Arial;
        margin: 0;
        background-color: #f0f0f0;
      }
      header {
        background-color: darkblue;
        color: white;
        padding: 15px;
      }
      .wrapper {
        display: flex;
        margin: 15px;
        gap: 15px;
      }
      .left-col {
        width: 25%;
        background-color: white;
        padding: 15px;
        border: 1px solid #ccc;
      }
      .right-col {
        width: 75%;
        background-color: white;
        padding: 15px;
        border: 1px solid #ccc;
      }
      .left-col ul {
        list-style-type: none;
        padding: 0;
      }
      .left-col li {
        padding: 8px 0;
        border-bottom: 1px solid #eee;
      }
      .left-col a {
        text-decoration: none;
        color: darkblue;
      }
    </style>
  </head>
  <body>
    <header>
      <h2>Student Dashboard</h2>
    </header>
    <div class="wrapper">
      <div class="left-col">
        <h3>Menu</h3>
        <ul>
          <li><a href="#">Profile</a></li>
          <li><a href="#">Attendance</a></li>
          <li><a href="#">Exam Schedule</a></li>
          <li><a href="#">Fees Status</a></li>
        </ul>
      </div>
      <div class="right-col">
        <h2>Welcome, Aryansh Sharma (Roll No: 48)</h2>
        <p>Branch: Computer Science &amp; Engineering | 3rd Semester</p>
        <hr />
        <h3>Notifications</h3>
        <p>• Web Technology lab files submission on 25-Oct-2026.</p>
        <p>• Mid-term test starting next month.</p>
      </div>
    </div>
  </body>
</html>
