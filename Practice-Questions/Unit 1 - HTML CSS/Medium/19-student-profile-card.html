<!doctype html>
<html>
  <head>
    <title>Student Profile Card</title>
    <style>
      body {
        font-family: Arial;
        background-color: #e0e0e0;
      }
      .card {
        background-color: white;
        width: 320px;
        margin: 50px auto;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #bbb;
        text-align: center;
      }
      .avatar {
        background-color: orange;
        color: white;
        width: 70px;
        height: 70px;
        line-height: 70px;
        border-radius: 50%;
        margin: 0 auto 10px auto;
        font-size: 24px;
        font-weight: bold;
      }
      h2 {
        margin: 5px 0;
        color: #333;
      }
      .details {
        color: #666;
        font-size: 14px;
        margin-bottom: 15px;
      }
      table {
        width: 100%;
        margin: 10px 0;
        font-size: 14px;
      }
      .contact-btn {
        background-color: darkblue;
        color: white;
        padding: 8px 16px;
        text-decoration: none;
        border-radius: 4px;
        display: inline-block;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="avatar">AS</div>
      <h2>Aryansh Sharma</h2>
      <p class="details">B.Tech - Computer Science &amp; Engineering</p>
      <hr />
      <table>
        <tr>
          <td><b>Roll No:</b></td>
          <td>48</td>
        </tr>
        <tr>
          <td><b>Semester:</b></td>
          <td>3rd Sem</td>
        </tr>
        <tr>
          <td><b>College:</b></td>
          <td>SSIPMT Raipur</td>
        </tr>
      </table>
      <a href="mailto:aryanshsharma2005@gmail.com" class="contact-btn"
        >Contact Student</a
      >
    </div>
  </body>
</html>
