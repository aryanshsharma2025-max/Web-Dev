<!doctype html>
<html>
  <head>
    <title>College Events</title>
    <style>
      body {
        font-family: Arial;
        background-color: #eee;
        padding: 20px;
      }
      h1 {
        text-align: center;
        color: darkblue;
      }
      .event-card {
        background-color: white;
        max-width: 650px;
        margin: 15px auto;
        display: flex;
        border: 1px solid #ccc;
        border-radius: 6px;
        overflow: hidden;
      }
      .date-badge {
        background-color: darkblue;
        color: white;
        padding: 20px;
        text-align: center;
        width: 80px;
      }
      .date-badge h2 {
        margin: 0;
        font-size: 26px;
      }
      .info {
        padding: 15px;
        flex: 1;
      }
      .info h3 {
        margin: 0 0 5px 0;
        color: #333;
      }
      .info p {
        margin: 0;
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Upcoming College Events</h1>
    <div class="event-card">
      <div class="date-badge">
        <h2>25</h2>
        Oct
      </div>
      <div class="info">
        <h3>Web-Development Hackathon</h3>
        <p>Venue: Computer Lab 2 | Time: 10:00 AM</p>
      </div>
    </div>

    <div class="event-card">
      <div class="date-badge">
        <h2>02</h2>
        Nov
      </div>
      <div class="info">
        <h3>Annual Technical Fest</h3>
        <p>Venue: Central Auditorium | Time: 9:30 AM</p>
      </div>
    </div>
  </body>
</html>
