<!doctype html>
<html>
  <head>
    <title>Horizontal Navbar</title>
    <style>
      body {
        font-family: Arial;
        margin: 0;
      }
      ul.navbar {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #333;
      }
      ul.navbar li {
        float: left;
      }
      ul.navbar li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 20px;
        text-decoration: none;
      }
      ul.navbar li a:hover {
        background-color: #111;
        color: orange;
      }
      .content {
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <ul class="navbar">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Courses</a></li>
      <li><a href="#">Faculty</a></li>
      <li><a href="#">Contact Us</a></li>
    </ul>
    <div class="content">
      <h2>Horizontal Navigation Bar</h2>
      <p>
        This is a simple horizontal navbar created using HTML list tags and CSS
        float.
      </p>
    </div>
  </body>
</html>
