<!doctype html>
<html>
  <head>
    <title>Student Login</title>
    <style>
      body {
        font-family: Arial;
        background-color: #2c3e50;
      }
      .login-card {
        background-color: white;
        width: 320px;
        margin: 80px auto;
        padding: 30px;
        border-radius: 8px;
        text-align: center;
      }
      h2 {
        color: #2c3e50;
        margin-bottom: 20px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      input[type="submit"] {
        background-color: #2980b9;
        color: white;
        border: none;
        padding: 10px;
        width: 100%;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
      }
      input[type="submit"]:hover {
        background-color: #1f618d;
      }
      .forgot {
        display: block;
        margin-top: 15px;
        font-size: 13px;
        color: #555;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h2>SSIPMT Student Login</h2>
      <form>
        <input
          type="text"
          name="rollno"
          placeholder="Roll Number"
          required
        /><br />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        /><br />
        <input type="submit" value="Login" />
      </form>
      <a href="#" class="forgot">Forgot Password?</a>
    </div>
  </body>
</html>
