<!doctype html>
<html>
  <head>
    <title>Hobbies Checkboxes</title>
  </head>
  <body>
    <h1>Student Hobbies</h1>
    <p>Please select your hobbies from the list below:</p>
    <hr />

    <form>
      <input type="checkbox" name="hobby" value="coding" checked />
      Coding<br /><br />
      <input type="checkbox" name="hobby" value="webdev" checked /> Web
      Development<br /><br />
      <input type="checkbox" name="hobby" value="reading" /> Reading Books<br /><br />
      <input type="checkbox" name="hobby" value="gaming" checked /> Playing
      Video Games<br /><br />
      <input type="checkbox" name="hobby" value="music" /> Listening to Music<br /><br />
      <input type="checkbox" name="hobby" value="cricket" /> Playing Cricket<br /><br />

      <input type="submit" value="Submit Hobbies" />
    </form>
  </body>
</html>
