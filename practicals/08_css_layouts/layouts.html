<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CSS Layouts</title>
        <style>
            body {
            font-family:Arial,sans-serif
            }
            div.box {
            padding:15px;
            color:#fff;
            text-align:center
            }
            .float-wrap {
            overflow:auto;
            border:2px solid #333
            }
            .float-box {
            float:left;
            width:30%;
            margin:1.5%;
            background:#e74c3c
            }
            .ib-box {
            display:inline-block;
            width:30%;
            background:#27ae60;
            margin:5px
            }
            .flex-wrap {
            display:flex;
            justify-content:space-around;
            align-items:center;
            border:2px solid #333;
            padding:10px
            }
            .flex-box {
            background:#2980b9;
            flex:1;
            margin:5px
            }
            .flex-box:nth-child(2) {
            flex:2;
            background:#8e44ad
            }
        </style>
    </head>
    <body>
        <h3>1. Float layout</h3>
        <div class="float-wrap">
            <div class="box float-box">Box 1</div>
            <div class="box float-box">Box 2</div>
            <div class="box float-box">Box 3</div>
        </div>
        <h3>2. Inline-block layout</h3>
        <div>
            <div class="box ib-box">Box 1</div>
            <div class="box ib-box">Box 2</div>
            <div class="box ib-box">Box 3</div>
        </div>
        <h3>3. Flexbox layout</h3>
        <div class="flex-wrap">
            <div class="box flex-box">Box 1 (flex: 1)</div>
            <div class="box flex-box">Box 2 (flex: 2)</div>
            <div class="box flex-box">Box 3 (flex: 1)</div>
        </div>
    </body>
</html>
