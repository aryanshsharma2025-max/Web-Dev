<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Selectors</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }
      #title {
        color: #fff;
        background: #1f4e79;
        padding: 10px;
        text-align: center;
      }
      .note {
        background: #fff3cd;
        padding: 8px;
        border-left: 5px solid orange;
      }
      .error {
        background: #f8d7da;
        padding: 8px;
        border-left: 5px solid red;
      }
      h2,
      h3 {
        color: #1f4e79;
      }
      ul li {
        margin: 4px 0;
      }
      a:link {
        color: blue;
      }
      a:visited {
        color: purple;
      }
      a:hover {
        color: red;
        text-decoration: underline;
      }
      a:active {
        color: orange;
      }
      li:first-child {
        font-weight: bold;
      }
      li:last-child {
        color: green;
      }
      tr:nth-child(even) {
        background: #eee;
      }
      input:focus {
        background: #e6f7ff;
        outline: 2px solid #1f4e79;
      }
      p::first-letter {
        font-size: 28px;
        color: crimson;
      }
    </style>
  </head>
  <body>
    <h1 id="title">CSS Selectors Demo</h1>
    <h2>Class selector</h2>
    <p class="note">This is a note paragraph.</p>
    <p class="error">This is an error paragraph.</p>
    <h2>Pseudo-classes</h2>
    <ul>
      <li>First item</li>
      <li>Second item</li>
      <li>Last item</li>
    </ul>
    <p>
      <a href="https://www.google.com">Hover over this link</a>
    </p>
    <table border="1" cellpadding="6" cellspacing="0">
      <tr>
        <td>Row 1</td>
      </tr>
      <tr>
        <td>Row 2</td>
      </tr>
      <tr>
        <td>Row 3</td>
      </tr>
      <tr>
        <td>Row 4</td>
      </tr>
    </table>
    <p>Click the box: <input type="text" placeholder="focus me" /></p>
  </body>
</html>
