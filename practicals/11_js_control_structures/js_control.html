<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript Control Structures</title>
  </head>
  <body>
    <h2>Control Structures</h2>
    <pre id="out"></pre>
    <script>
      var out = "";
      function show(t) {
        out += t + "\n";
      }
      let marks = 72;
      if (marks >= 75) show("Grade A");
      else if (marks >= 60) show("Grade B");
      else if (marks >= 40) show("Grade C");
      else show("Fail");
      let day = 3;
      switch (day) {
        case 1:
          show("Monday");
          break;
        case 2:
          show("Tuesday");
          break;
        case 3:
          show("Wednesday");
          break;
        default:
          show("Other day");
      }
      show("\nfor loop (1 to 5):");
      let s = "";
      for (let i = 1; i <= 5; i++) s += i + " ";
      show(s);
      let n = 5,
        fact = 1,
        i = n;
      while (i > 0) {
        fact *= i;
        i--;
      }
      show("Factorial of " + n + " = " + fact);
      let k = 1,
        table = "";
      do {
        table += 7 * k + " ";
        k++;
      } while (k <= 10);
      show("Table of 7: " + table);
      let odd = "";
      for (let j = 1; j <= 10; j++) {
        if (j % 2 === 0) continue;
        if (j > 7) break;
        odd += j + " ";
      }
      show("Odd numbers up to 7: " + odd);
      let fruits = ["apple", "banana", "cherry"];
      for (let f of fruits) show("fruit: " + f);
      let student = {
        roll: 1,
        name: "Asha",
      };
      for (let key in student) show(key + " = " + student[key]);
      document.getElementById("out").textContent = out;
    </script>
  </body>
</html>
