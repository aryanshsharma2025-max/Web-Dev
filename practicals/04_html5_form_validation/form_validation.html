<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML5 Form Validation</title>
</head>

<body>
    <h2>Registration Form</h2>
    <form action="#" method="post">
        <p>Name: <input type="text" name="name" required minlength="3" maxlength="30" placeholder="Enter full name"></p>
        <p>Email: <input type="email" name="email" required placeholder="abc@example.com"></p>
        <p>Password: <input type="password" name="pwd" required minlength="6" pattern="(?=.*\d)(?=.*[a-z]).{6,}"
                title="At least 6 characters with a letter and a digit"></p>
        <p>Mobile No: <input type="tel" name="mobile" required pattern="[6-9][0-9]{9}" title="10-digit mobile number">
        </p>
        <p>Age: <input type="number" name="age" min="17" max="60" required></p>
        <p>Date of Birth: <input type="date" name="dob" required></p>
        <p>Website: <input type="url" name="site" placeholder="https://example.com"></p>
        <p>Gender: <input type="radio" name="gender" value="M" required> Male <input type="radio" name="gender"
                value="F"> Female</p>
        <p>Branch: <select name="branch" required>
                <option value="">-- Select --</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>ME</option>
            </select></p>
        <p>Hobbies: <input type="checkbox" name="hobby" value="read"> Reading <input type="checkbox" name="hobby"
                value="music"> Music</p>
        <p>Address:<br><textarea name="address" rows="3" cols="30" required></textarea></p>
        <p><input type="checkbox" required> I agree to the terms</p><input type="submit" value="Register"> <input
            type="reset" value="Clear">
    </form>
</body>

</html>
