<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript Variables, Data Types and Operators</title>
  </head>
  <body>
    <h2>JavaScript Basics</h2>
    <pre id="out"></pre>
    <script>
      var out = "";
      function show(text) {
        out += text + "\n";
      }
      var a = 10;
      let b = 3;
      const PI = 3.14159;
      let name = "Asha",
        marks = 85.5,
        passed = true,
        nothing = null,
        notAssigned,
        colors = ["red", "green"],
        student = {
          roll: 1,
          name: "Asha",
        };
      show("--- Data types ---");
      show("name     : " + name + "  -> " + typeof name);
      show("marks    : " + marks + "  -> " + typeof marks);
      show("passed   : " + passed + "  -> " + typeof passed);
      show("nothing  : " + nothing + "  -> " + typeof nothing);
      show("undefined: " + notAssigned + "  -> " + typeof notAssigned);
      show("colors   : " + colors + "  -> " + typeof colors);
      show("student  : " + JSON.stringify(student) + "  -> " + typeof student);
      show("\n--- Arithmetic (a=10, b=3) ---");
      ["+", "-", "*", "/", "%", "**"].forEach((op) =>
        show(
          `a ${op} b = ${Function(
            "a",
            "b",
            `return a $ {
            op
            }
            b`,
          )(a, b)}`,
        ),
      );
      show("\n--- Comparison ---");
      show("a > b   : " + (a > b));
      show("a == '10': " + (a == "10") + "   (value only)");
      show("a === '10': " + (a === "10") + "  (value and type)");
      show("a != b  : " + (a != b));
      show("\n--- Logical ---");
      show("(a > 5 && b > 5): " + (a > 5 && b > 5));
      show("(a > 5 || b > 5): " + (a > 5 || b > 5));
      show("!(a > 5)        : " + !(a > 5));
      let c = 5;
      c += 3;
      show("c += 3 -> " + c);
      c *= 2;
      show("c *= 2 -> " + c);
      c++;
      show("c++    -> " + c);
      show("Ternary: " + (marks >= 40 ? "Pass" : "Fail"));
      document.getElementById("out").textContent = out;
    </script>
  </body>
</html>
