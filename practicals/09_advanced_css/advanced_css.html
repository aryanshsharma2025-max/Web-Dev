<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Advanced CSS Features</title><style>body{font-family:Arial,sans-serif;background:#f4f4f4}.demo{width:280px;padding:20px;margin:20px;display:inline-block;vertical-align:top;background:#fff}.round{border:3px solid #1f4e79;border-radius:20px}.circle{border:3px solid crimson;border-radius:50%;height:200px;text-align:center;line-height:200px}.mixed{border:3px solid green;border-radius:40px 5px 40px 5px}.bimg{border:12px solid transparent;border-image:linear-gradient(45deg,red,orange,yellow,green,blue) 1}.shadow{box-shadow:6px 6px 12px gray;border-radius:10px}.grad{background:linear-gradient(to right,#ff9966,#ff5e62);color:#fff;border-radius:10px}.text{text-shadow:2px 2px 4px gray;font-size:26px}</style></head><body><div class="demo round">border-radius: 20px</div><div class="demo circle">border-radius: 50%</div><div class="demo mixed">Different radius for each corner</div><div class="demo bimg">border-image (linear gradient)</div><div class="demo shadow">box-shadow</div><div class="demo grad">linear-gradient background</div><div class="demo"><span class="text">text-shadow</span></div></body></html>
