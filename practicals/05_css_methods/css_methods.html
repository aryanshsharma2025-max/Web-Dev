<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Inline, Internal and External CSS</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      p {
        color: darkgreen;
        font-size: 18px;
      }

      h2 {
        color: purple;
      }
    </style>
  </head>

  <body>
    <h1>CSS Methods</h1>
    <h2 style="color: red; text-align: center">
      Inline CSS (highest priority)
    </h2>
    <h2>Internal CSS: heading is purple</h2>
    <p>Internal CSS: this paragraph is dark green.</p>
    <div class="box">External CSS: this box is styled in style.css</div>
  </body>
</html>
