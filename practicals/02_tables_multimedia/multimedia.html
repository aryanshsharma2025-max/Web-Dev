<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tables and Multimedia</title>
  </head>
  <body>
    <h2>Result Table</h2>
    <table border="1" cellpadding="8" cellspacing="0">
      <caption>
        Student Marks
      </caption>
      <thead>
        <tr>
          <th>Roll No</th>
          <th>Name</th>
          <th colspan="2">Marks</th>
        </tr>
        <tr>
          <th></th>
          <th></th>
          <th>Theory</th>
          <th>Practical</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Asha</td>
          <td>72</td>
          <td>38</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Bharat</td>
          <td>65</td>
          <td>35</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Chitra</td>
          <td>80</td>
          <td>40</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2">Class Average</td>
          <td>72.3</td>
          <td>37.7</td>
        </tr>
      </tfoot>
    </table>
    <h2>Audio</h2>
    <audio controls>
      <source src="sample.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
    <h2>Video</h2>
    <video width="400" height="240" controls>
      <source src="sample.mp4" type="video/mp4" />
      Your browser does not support the video element.
    </video>
    <h2>iframe</h2>
    <iframe
      src="https://www.wikipedia.org"
      width="500"
      height="300"
      title="Wikipedia"
    >
    </iframe>
  </body>
</html>
