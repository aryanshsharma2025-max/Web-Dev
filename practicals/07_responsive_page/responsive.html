<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Web Page</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      header {
        background: #1f4e79;
        color: #fff;
        text-align: center;
        padding: 15px;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
      }

      .card {
        width: 25%;
        padding: 20px;
        color: #fff;
        text-align: center;
      }

      .c1 {
        background: #e74c3c;
      }

      .c2 {
        background: #27ae60;
      }

      .c3 {
        background: #2980b9;
      }

      .c4 {
        background: #8e44ad;
      }

      @media (max-width: 900px) {
        .card {
          width: 50%;
        }
      }

      @media (max-width: 500px) {
        .card {
          width: 100%;
        }

        header h1 {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Responsive Layout</h1>
      <p>Resize the browser window</p>
    </header>
    <div class="container">
      <div class="card c1">Box 1</div>
      <div class="card c2">Box 2</div>
      <div class="card c3">Box 3</div>
      <div class="card c4">Box 4</div>
    </div>
  </body>
</html>
